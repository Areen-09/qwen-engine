name: Build & Package Wheels

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: AMD64
            cibw_arch: AMD64
            cibw_build: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          - os: ubuntu-latest
            arch: x86_64
            cibw_arch: x86_64
            cibw_build: "cp39-* cp310-* cp311-* cp312-* cp313-*"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Windows CUDA Toolkit (12.4)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.4.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'
          use-github-cache: false

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel>=2.19.0

      - name: Build Wheels (Windows)
        if: runner.os == 'Windows'
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: ${{ matrix.cibw_arch }}
          CIBW_ENVIRONMENT: >-
            CMAKE_CUDA_ARCHITECTURES="75;80;86;89;90;90-virtual"
            CUDA_USE_STATIC_CUDA_RUNTIME="ON"
            CMAKE_CUDA_FLAGS="-allow-unsupported-compiler"
          CIBW_BEFORE_BUILD: "pip install nanobind scikit-build-core ninja"
          CIBW_BUILD_VERBOSITY: 1
        run: python -m cibuildwheel --output-dir dist

      - name: Build Wheels (Linux manylinux_2_28)
        if: runner.os == 'Linux'
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: ${{ matrix.cibw_arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT: >-
            CUDA_PATH=/usr/local/cuda-12.4
            PATH=/opt/rh/gcc-toolset-12/root/usr/bin:/usr/local/cuda-12.4/bin:$PATH
            LD_LIBRARY_PATH=/opt/rh/gcc-toolset-12/root/usr/lib64:/usr/local/cuda-12.4/lib64:$LD_LIBRARY_PATH
            CC=/opt/rh/gcc-toolset-12/root/usr/bin/gcc
            CXX=/opt/rh/gcc-toolset-12/root/usr/bin/g++
            CUDAHOSTCXX=/opt/rh/gcc-toolset-12/root/usr/bin/g++
            CMAKE_CUDA_HOST_COMPILER=/opt/rh/gcc-toolset-12/root/usr/bin/g++
            CMAKE_CUDA_ARCHITECTURES="75;80;86;89;90;90-virtual"
            CUDA_USE_STATIC_CUDA_RUNTIME="ON"
            CMAKE_CUDA_FLAGS="-allow-unsupported-compiler"
          CIBW_BEFORE_ALL_LINUX: >-
            curl -fsSL https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo -o /etc/yum.repos.d/cuda-rhel8.repo &&
            dnf install -y --nogpgcheck cuda-compiler-12-4 cuda-cudart-devel-12-4 gcc-toolset-12-gcc gcc-toolset-12-gcc-c++
          CIBW_BEFORE_BUILD: "pip install nanobind scikit-build-core ninja"
          CIBW_BUILD_VERBOSITY: 1
        run: python -m cibuildwheel --output-dir dist

      - name: Upload Built Wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist --outdir dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/wheels-*/*.whl
            artifacts/sdist/*.tar.gz
          generate_release_notes: true

