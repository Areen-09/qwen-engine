[build-system]
requires = ["scikit-build-core>=0.9.0", "nanobind>=2.0.0"]
build-backend = "scikit_build_core.build"

[project]
name = "qwen-engine"
version = "0.2.0"
description = "Bare-metal zero-dependency C++20/CUDA inference engine for Qwen with unified hybrid attention and tensor parallelism"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Areen-09" }
]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Homepage = "https://github.com/Areen-09/qwen-engine"
Repository = "https://github.com/Areen-09/qwen-engine"

[tool.scikit-build]
wheel.packages = ["src/python/qwen_engine"]
cmake.build-type = "Release"
cmake.args = ["-G", "Ninja", "-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded"]
ninja.version = ">=1.10"
sdist.include = [
    "CMakeLists.txt",
    "include/*",
    "src/*",
    "src/kernels/*",
    "src/python/qwen_engine/*",
]
sdist.exclude = [
    "models/*",
    "build/*",
    ".venv/*",
    "scratch/*",
]
